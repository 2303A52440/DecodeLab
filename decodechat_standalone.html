<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DecodeChat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg-side: #f7f7f8; --border: #e5e5e5;
    --text: #1f1f1f; --text-soft: #6b6b6b; --bubble-user: #f4f4f5; --accent: #10a37f;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  header .brand { font-size: 15px; font-weight: 600; flex-shrink: 0; }
  #liveClock { font-size: 13px; color: var(--text-soft); }
  #apiKeyInput {
    flex: 1; max-width: 280px; font-size: 12px; padding: 6px 10px;
    border: 1px solid var(--border); border-radius: 8px; outline: none;
  }
  header .new-chat {
    font-size: 13px; color: var(--text-soft); background: transparent;
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  header .new-chat:hover { background: var(--bg-side); }
  #keyBanner {
    background: #fff8e6; border-bottom: 1px solid #f0e0b0; color: #6b5410;
    font-size: 12px; text-align: center; padding: 6px; flex-shrink: 0;
  }
  #chatArea { flex: 1; overflow-y: auto; padding: 24px 0 12px; }
  .center-col { max-width: 680px; margin: 0 auto; padding: 0 20px; }
  .row { display: flex; gap: 14px; margin-bottom: 26px; align-items: flex-start; }
  .avatar {
    width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; color: #fff;
  }
  .avatar.user { background: #6b6b6b; }
  .avatar.bot { background: var(--accent); }
  .bubble-content {
    font-size: 15px; line-height: 1.65; padding-top: 3px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .row.user .bubble-content { background: var(--bubble-user); padding: 10px 14px; border-radius: 12px; }
  .thinking { display: flex; gap: 4px; padding-top: 8px; }
  .thinking span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--text-soft);
    animation: pulse 1.2s infinite ease-in-out;
  }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  .welcome { max-width: 680px; margin: 12vh auto 0; text-align: center; padding: 0 20px; }
  .welcome h1 { font-size: 26px; font-weight: 600; margin-bottom: 8px; }
  .welcome p { color: var(--text-soft); font-size: 14px; }
  footer { flex-shrink: 0; padding: 12px 20px 20px; border-top: 1px solid var(--border); }
  .input-shell {
    max-width: 680px; margin: 0 auto; display: flex; align-items: flex-end;
    border: 1px solid var(--border); border-radius: 16px; padding: 10px 10px 10px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  #userInput {
    flex: 1; border: none; outline: none; resize: none;
    font-family: inherit; font-size: 15px; max-height: 160px; line-height: 1.5;
  }
  #sendBtn {
    background: var(--text); color: #fff; border: none; border-radius: 8px;
    width: 30px; height: 30px; cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 14px;
  }
  #sendBtn:disabled { background: #d0d0d0; cursor: default; }
  .disclaimer { text-align: center; font-size: 11px; color: var(--text-soft); margin-top: 8px; }
  .errorMsg { color: #b3261e; font-size: 13px; padding-top: 4px; }
</style>
</head>
<body>

<div id="keyBanner">Paste your Anthropic API key in the box above to start chatting. Get one free at console.anthropic.com</div>

<header>
  <span class="brand">DecodeChat</span>
  <input type="password" id="apiKeyInput" placeholder="sk-ant-... (your API key)" />
  <span id="liveClock"></span>
  <button class="new-chat" id="newChatBtn">New chat</button>
</header>

<div id="chatArea">
  <div class="welcome" id="welcome">
    <h1>What can I help with?</h1>
    <p>Enter your API key above, then start typing.</p>
  </div>
  <div class="center-col" id="thread"></div>
</div>

<footer>
  <div class="input-shell">
    <textarea id="userInput" rows="1" placeholder="Message DecodeChat..."></textarea>
    <button id="sendBtn">↑</button>
  </div>
  <div class="disclaimer">Your API key is used only in this browser tab and is never saved or sent anywhere except Anthropic's API.</div>
</footer>

<script>
  let history = [];

  const thread = document.getElementById('thread');
  const welcome = document.getElementById('welcome');
  const input = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  const chatArea = document.getElementById('chatArea');
  const newChatBtn = document.getElementById('newChatBtn');
  const apiKeyInput = document.getElementById('apiKeyInput');
  const keyBanner = document.getElementById('keyBanner');

  apiKeyInput.addEventListener('input', () => {
    keyBanner.style.display = apiKeyInput.value.trim() ? 'none' : 'block';
  });

  function autoGrow() {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  }
  input.addEventListener('input', autoGrow);
  function scrollDown() { chatArea.scrollTop = chatArea.scrollHeight; }

  function addRow(role, text, isError) {
    welcome.style.display = 'none';
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + role;
    avatar.textContent = role === 'user' ? 'U' : 'D';
    const content = document.createElement('div');
    content.className = isError ? 'errorMsg' : 'bubble-content';
    content.textContent = text;
    row.appendChild(avatar);
    row.appendChild(content);
    thread.appendChild(row);
    scrollDown();
  }

  function addThinking() {
    const row = document.createElement('div');
    row.className = 'row bot';
    row.id = 'thinkingRow';
    const avatar = document.createElement('div');
    avatar.className = 'avatar bot';
    avatar.textContent = 'D';
    const think = document.createElement('div');
    think.className = 'thinking';
    think.innerHTML = '<span></span><span></span><span></span>';
    row.appendChild(avatar);
    row.appendChild(think);
    thread.appendChild(row);
    scrollDown();
  }

  function removeThinking() {
    const el = document.getElementById('thinkingRow');
    if (el) el.remove();
  }

  async function callClaude() {
    const key = apiKeyInput.value.trim();
    if (!key) {
      return { text: 'Enter your API key at the top of the page first.', isError: true };
    }

    const now = new Date().toString();

    try {
      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': key,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 1000,
          system: 'The current date and time is ' + now + '. Use this if asked about the date, time, or day.',
          messages: history
        })
      });

      const data = await response.json();

      if (data.error) {
        return { text: 'API error: ' + data.error.message, isError: true };
      }

      const textBlock = data.content.find(b => b.type === 'text');
      return { text: textBlock ? textBlock.text : 'No response returned.', isError: false };

    } catch (err) {
      return { text: 'Request failed: ' + err.message, isError: true };
    }
  }

  async function handleSend() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    autoGrow();
    sendBtn.disabled = true;

    addRow('user', text);
    history.push({ role: 'user', content: text });

    addThinking();
    const result = await callClaude();
    removeThinking();

    addRow('bot', result.text, result.isError);
    if (!result.isError) {
      history.push({ role: 'assistant', content: result.text });
    } else {
      history.pop();
    }

    sendBtn.disabled = false;
    input.focus();
  }

  sendBtn.addEventListener('click', handleSend);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      handleSend();
    }
  });

  newChatBtn.addEventListener('click', () => {
    history = [];
    thread.innerHTML = '';
    welcome.style.display = 'block';
    input.value = '';
    autoGrow();
    input.focus();
  });

  const liveClock = document.getElementById('liveClock');
  function tick() {
    const now = new Date();
    liveClock.textContent = now.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) +
      ' · ' + now.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  tick();
  setInterval(tick, 1000);
</script>

</body>
</html>
